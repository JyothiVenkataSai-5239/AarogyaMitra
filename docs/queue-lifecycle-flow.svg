<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 380" width="100%" height="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgCanvas" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="step1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="step2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="step3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="step4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="step5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000" flood-opacity="0.4" />
    </filter>
    <marker id="arrowRight" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="940" height="380" rx="16" fill="url(#bgCanvas)" />
  <rect x="1" y="1" width="938" height="378" rx="15" fill="none" stroke="#1f2937" stroke-width="1.5" />

  <!-- Title -->
  <text x="470" y="34" text-anchor="middle" fill="#f9fafb" font-size="17" font-weight="700" letter-spacing="0.04em">REAL-TIME QUEUE ORCHESTRATION PIPELINE</text>
  <text x="470" y="52" text-anchor="middle" fill="#9ca3af" font-size="11">From Appointment Creation to Real-Time State Broadcast</text>

  <!-- Step 1: Intake -->
  <g filter="url(#cardShadow)">
    <rect x="25" y="75" width="160" height="150" rx="12" fill="#1f2937" stroke="#3b82f6" stroke-width="1.5" />
    <rect x="25" y="75" width="160" height="32" rx="12" fill="url(#step1)" />
    <text x="105" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">1. INTAKE</text>
    <text x="105" y="130" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Appointment</text>
    <text x="105" y="148" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Created</text>
    <text x="105" y="175" text-anchor="middle" fill="#9ca3af" font-size="10">• Online Patient</text>
    <text x="105" y="193" text-anchor="middle" fill="#9ca3af" font-size="10">• Walk-In Patient</text>
    <text x="105" y="211" text-anchor="middle" fill="#9ca3af" font-size="10">• Auto Doctor Match</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 185 150 L 205 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)" />

  <!-- Step 2: Scoring -->
  <g filter="url(#cardShadow)">
    <rect x="210" y="75" width="160" height="150" rx="12" fill="#1f2937" stroke="#0ea5e9" stroke-width="1.5" />
    <rect x="210" y="75" width="160" height="32" rx="12" fill="url(#step2)" />
    <text x="290" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">2. SCORING</text>
    <text x="290" y="130" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Priority &amp; Duration</text>
    <text x="290" y="148" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Calculated</text>
    <text x="290" y="175" text-anchor="middle" fill="#9ca3af" font-size="10">• Disease Severity</text>
    <text x="290" y="193" text-anchor="middle" fill="#9ca3af" font-size="10">• Emergency (+100)</text>
    <text x="290" y="211" text-anchor="middle" fill="#9ca3af" font-size="10">• Senior Age (+20)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 370 150 L 390 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)" />

  <!-- Step 3: Sequencing -->
  <g filter="url(#cardShadow)">
    <rect x="395" y="75" width="160" height="150" rx="12" fill="#1f2937" stroke="#10b981" stroke-width="1.5" />
    <rect x="395" y="75" width="160" height="32" rx="12" fill="url(#step3)" />
    <text x="475" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">3. SEQUENCING</text>
    <text x="475" y="130" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Token &amp; Window</text>
    <text x="475" y="148" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Assignment</text>
    <text x="475" y="175" text-anchor="middle" fill="#9ca3af" font-size="10">• Priority Ordering</text>
    <text x="475" y="193" text-anchor="middle" fill="#9ca3af" font-size="10">• Token # Allocation</text>
    <text x="475" y="211" text-anchor="middle" fill="#9ca3af" font-size="10">• Estimated Start Time</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 555 150 L 575 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)" />

  <!-- Step 4: Disruption Handling -->
  <g filter="url(#cardShadow)">
    <rect x="580" y="75" width="160" height="150" rx="12" fill="#1f2937" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="580" y="75" width="160" height="32" rx="12" fill="url(#step4)" />
    <text x="660" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">4. DISRUPTION</text>
    <text x="660" y="130" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Dynamic Queue</text>
    <text x="660" y="148" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Recalculation</text>
    <text x="660" y="175" text-anchor="middle" fill="#9ca3af" font-size="10">• Doctor Delays (+min)</text>
    <text x="660" y="193" text-anchor="middle" fill="#9ca3af" font-size="10">• Patient No-Shows</text>
    <text x="660" y="211" text-anchor="middle" fill="#9ca3af" font-size="10">• Early Completions</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 740 150 L 760 150" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrowRight)" />

  <!-- Step 5: Broadcast -->
  <g filter="url(#cardShadow)">
    <rect x="765" y="75" width="150" height="150" rx="12" fill="#1f2937" stroke="#8b5cf6" stroke-width="1.5" />
    <rect x="765" y="75" width="150" height="32" rx="12" fill="url(#step5)" />
    <text x="840" y="96" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">5. BROADCAST</text>
    <text x="840" y="130" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">Real-Time Sync</text>
    <text x="840" y="148" text-anchor="middle" fill="#f3f4f6" font-size="12" font-weight="600">via Socket.IO</text>
    <text x="840" y="175" text-anchor="middle" fill="#9ca3af" font-size="10">• queue:updated</text>
    <text x="840" y="193" text-anchor="middle" fill="#9ca3af" font-size="10">• appointment:updated</text>
    <text x="840" y="211" text-anchor="middle" fill="#9ca3af" font-size="10">• Email Alert Push</text>
  </g>

  <!-- Lower Feedback Loop: Disruption triggers recalculation and broadcast -->
  <path d="M 840 225 L 840 280 L 475 280 L 475 230" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="4 3" marker-end="url(#arrowRight)" />
  <rect x="580" y="265" width="160" height="26" rx="6" fill="#111827" stroke="#374151" />
  <text x="660" y="282" text-anchor="middle" fill="#a78bfa" font-size="10" font-weight="600">Continuous Sync Loop</text>

  <!-- Bottom Legend bar -->
  <rect x="25" y="325" width="890" height="36" rx="8" fill="#1e293b" stroke="#334155" />
  <text x="45" y="347" fill="#94a3b8" font-size="11"><tspan font-weight="700" fill="#38bdf8">Triage Engine:</tspan> Highest clinical priority cases advance automatically while preserving FIFO order within identical acuity levels.</text>
</svg>
